# Opt-in: publishes the datastores on localhost for local dev and integration tests.
#   docker compose -f docker-compose.yml -f docker-compose.ports.yml up -d mongo redis
services:
  mongo:
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
